    function exportJSON() {
      const payload = {
        title: "Jarvis Program Plan",
        exportedAt: new Date().toISOString(),
        features: featuresData,
        personas: availablePersonas,
        components: availableComponents
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Jarvis_Program_Plan_${formatDateInput(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = JSON.parse(evt.target.result);
          if (data && Array.isArray(data.features)) {
            let personas = availablePersonas;
            let components = availableComponents;
            if (Array.isArray(data.personas)) {
              personas = Array.from(new Set([...availablePersonas, ...data.personas]));
            }
            if (Array.isArray(data.components)) {
              components = Array.from(new Set([...availableComponents, ...data.components]));
            }
            commitOp({
              type: "replaceAll",
              features: data.features,
              personas: personas,
              components: components
            });
            renderApp();
            alert("Program Plan successfully loaded from JSON!");
          } else {
            alert("Invalid JSON format. Expected an object with a 'features' array.");
          }
        } catch (err) {
          alert("Error parsing JSON file: " + err.message);
        }
        e.target.value = "";
      };
      reader.readAsText(file);
    }

    /* =====================================================================
       Bi-Weekly Milestone Generator
       ===================================================================== */
    let biWeeklyMilestones = [];

    function generateMilestones() {
      biWeeklyMilestones = [];
      let mIndex = 1;

      // Start at Anchor Date 11/18/2026 and generate forward
      let cur = new Date(ANCHOR_DATE.getTime());
      while (cur <= TIMELINE_END) {
        biWeeklyMilestones.push({
          id: `M${mIndex}`,
          label: `M${mIndex}: ${formatDateDisplay(cur)}`,
          date: new Date(cur.getTime())
        });
        cur = addDays(cur, 14);
        mIndex++;
      }
    }

    /* =====================================================================
       Timeline Coordinate Conversion
       ===================================================================== */
    function dateToPx(d) {
      const days = diffDays(TIMELINE_START, d);
      return days * pxPerDay;
    }

    function getTimelineTotalWidth() {
      const totalDays = diffDays(TIMELINE_START, TIMELINE_END);
      return totalDays * pxPerDay;
    }

    /* =====================================================================
       Zoom and Navigation
       ===================================================================== */
    function setZoom(level) {
      currentZoom = level;
      pxPerDay = ZOOM_LEVELS[level];

      document.querySelectorAll(".zoom-btn").forEach(btn => btn.classList.remove("active"));
      document.getElementById(`zoom-${level}`).classList.add("active");

      renderApp();
      // Keep today centered or visible
      jumpToToday();
    }

    function scrollTimeline(delta) {
      const el = document.getElementById("right-pane-el");
      el.scrollBy({ left: delta, behavior: "smooth" });
    }

    function jumpToToday() {
      const rightPane = document.getElementById("right-pane-el");
      const todayX = dateToPx(TODAY_DATE);
      const paneWidth = rightPane.clientWidth;
      rightPane.scrollTo({
        left: Math.max(0, todayX - (paneWidth / 2)),
        behavior: "smooth"
      });
    }

    /* =====================================================================
       Synchronized Scrolling between Left Pane & Right Timeline Body
       ===================================================================== */
    function setupScrollSync() {
      const leftPaneList = document.getElementById("features-list-el");
      const rightPaneBody = document.getElementById("timeline-body-el");

      let isSyncingLeft = false;
      let isSyncingRight = false;

      leftPaneList.onscroll = () => {
        if (!isSyncingLeft) {
          isSyncingRight = true;
          rightPaneBody.scrollTop = leftPaneList.scrollTop;
        }
        isSyncingLeft = false;
      };

      rightPaneBody.onscroll = () => {
        if (!isSyncingRight) {
          isSyncingLeft = true;
          leftPaneList.scrollTop = rightPaneBody.scrollTop;
        }
        isSyncingRight = false;
      };
    }

    /* =====================================================================
       Render Application
       ===================================================================== */
    function renderApp() {
      generateMilestones();
      renderKPIs();
      renderPersonaFilterOptions();
      renderMonthFilterOptions();

      const totalWidth = getTimelineTotalWidth();
      document.getElementById("timeline-inner-container-el").style.width = `${totalWidth}px`;

      renderMilestoneHeader();
      renderGridLines();
      renderRows();
      setupScrollSync();
    }

    function renderKPIs() {
      const total = featuresData.length;
      let onTrack = 0, delayed = 0, deployed = 0;
      const personaSet = new Set();

      featuresData.forEach(f => {
        if (f.status === "On Track") onTrack++;
        else if (f.status === "Delayed") delayed++;
        else if (f.status === "Deployed") deployed++;

        if (Array.isArray(f.personas)) {
          f.personas.forEach(p => personaSet.add(p));
        }
      });

      const container = document.getElementById("kpi-container");
      container.innerHTML = `
        <div class="kpi-card">
          <span class="kpi-val">${total}</span>
          <span class="kpi-label">Features</span>
        </div>
        <div class="kpi-card" style="border-color: var(--status-ontrack-border);">
          <span class="kpi-val" style="color: var(--status-ontrack);">${onTrack}</span>
          <span class="kpi-label">On Track</span>
        </div>
        <div class="kpi-card" style="border-color: var(--status-delayed-border);">
          <span class="kpi-val" style="color: var(--status-delayed);">${delayed}</span>
          <span class="kpi-label">Delayed</span>
        </div>
        <div class="kpi-card" style="border-color: var(--status-deployed-border);">
          <span class="kpi-val" style="color: var(--status-deployed);">${deployed}</span>
          <span class="kpi-label">Deployed</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-val" style="color: #c084fc;">${personaSet.size}</span>
          <span class="kpi-label">Active Personas</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-val" style="color: #67e8f9;">Bi-Weekly</span>
          <span class="kpi-label">Cadence (M1: 11/18/26)</span>
        </div>
      `;
    }

    function renderPersonaFilterOptions() {
      const select = document.getElementById("filter-persona");
      const current = select.value;
      let html = `<option value="ALL">All Personas</option>`;
      availablePersonas.forEach(p => {
        html += `<option value="${p}">${p}</option>`;
      });
      select.innerHTML = html;
      select.value = current;
    }

    /* Populate GA Months Dropdown dynamically from Features */
    function renderMonthFilterOptions() {
      const select = document.getElementById("filter-month");
      if (!select) return;
      const current = select.value || "ALL";

      const monthMap = new Map();

      featuresData.forEach(f => {
        const rollup = calculateFeatureRollup(f);
        if (rollup.gaDate) {
          const y = rollup.gaDate.getFullYear();
          const m = String(rollup.gaDate.getMonth() + 1).padStart(2, "0");
          const key = `${y}-${m}`;
          if (!monthMap.has(key)) {
            monthMap.set(key, new Date(y, rollup.gaDate.getMonth(), 1));
          }
        }
      });

      const sortedKeys = Array.from(monthMap.keys()).sort();
      const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ];

      let html = `<option value="ALL">All GA Months</option>`;
      sortedKeys.forEach(key => {
        const d = monthMap.get(key);
        const label = `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
        html += `<option value="${key}">${label}</option>`;
      });

      select.innerHTML = html;
      if (sortedKeys.includes(current) || current === "ALL") {
        select.value = current;
      } else {
        select.value = "ALL";
      }
    }

    function renderMilestoneHeader() {
      const milestonesRow = document.getElementById("milestones-row-el");
      const weeksRow = document.getElementById("weeks-row-el");

      let mHtml = "";
      biWeeklyMilestones.forEach(m => {
        const x = dateToPx(m.date);
        const w = 14 * pxPerDay;
        mHtml += `
          <div class="milestone-cell" style="left: ${x}px; width: ${w}px;">
            <span class="milestone-tag">${m.id}</span>
            <span>${formatDateDisplay(m.date)}</span>
          </div>
        `;
      });
      milestonesRow.innerHTML = mHtml;

      // Render week indicators
      let wHtml = "";
      let cur = new Date(TIMELINE_START.getTime());
      while (cur <= TIMELINE_END) {
        const x = dateToPx(cur);
        const w = 7 * pxPerDay;
        wHtml += `
          <div class="week-cell" style="left: ${x}px; width: ${w}px;">
            ${formatDateDisplay(cur)}
          </div>
        `;
        cur = addDays(cur, 7);
      }
      weeksRow.innerHTML = wHtml;
    }

    function renderGridLines() {
      const layer = document.getElementById("grid-lines-layer-el");
      let html = "";

      // Milestone vertical lines
      biWeeklyMilestones.forEach(m => {
        const x = dateToPx(m.date);
        html += `<div class="milestone-grid-line" style="left: ${x}px;"></div>`;
      });

      // Today Marker Line
      const todayX = dateToPx(TODAY_DATE);
      html += `
        <div class="today-marker-line" style="left: ${todayX}px;">
          <div class="today-badge-top">TODAY: 11/18/26</div>
        </div>
      `;

      layer.innerHTML = html;
    }

    /* Filter Predicate */
    function getFilteredFeatures() {
      const search = document.getElementById("filter-search").value.toLowerCase().trim();
      const monthFilter = document.getElementById("filter-month") ? document.getElementById("filter-month").value : "ALL";
      const status = document.getElementById("filter-status").value;
      const type = document.getElementById("filter-type").value;
      const persona = document.getElementById("filter-persona").value;

      return featuresData.filter(f => {
        const rollup = calculateFeatureRollup(f);

        // Filter by Month (GA Date)
        if (monthFilter !== "ALL") {
          if (!rollup.gaDate) return false;
          const y = rollup.gaDate.getFullYear();
          const m = String(rollup.gaDate.getMonth() + 1).padStart(2, "0");
          const key = `${y}-${m}`;
          if (key !== monthFilter) return false;
        }

        if (status !== "ALL" && f.status !== status) return false;
        if (type !== "ALL" && f.type !== type) return false;
        if (persona !== "ALL" && (!f.personas || !f.personas.includes(persona))) return false;
        if (search) {
          const matchDesc = f.description.toLowerCase().includes(search);
          const matchComp = f.components && f.components.some(c => c.name.toLowerCase().includes(search));
          const matchPersona = f.personas && f.personas.some(p => p.toLowerCase().includes(search));
          if (!matchDesc && !matchComp && !matchPersona) return false;
        }
        return true;
      });
    }

    function renderRows() {
      const filtered = getFilteredFeatures();
      document.getElementById("features-count-label").innerText = filtered.length;

      const leftContainer = document.getElementById("features-list-el");
      const rightContainer = document.getElementById("timeline-rows-container");

      let leftHtml = "";
      let rightHtml = "";

      if (filtered.length === 0) {
        leftContainer.innerHTML = `<div style="padding: 30px; text-align: center; color: var(--text-muted); font-size: 13px;">No feature lines match your search criteria.</div>`;
        rightContainer.innerHTML = "";
        return;
      }

      filtered.forEach(feature => {
        const rollup = calculateFeatureRollup(feature);
        const isExpanded = expandedFeatureIds.has(feature.id);

        // Status Badge Class
        let statusBadgeClass = "status-badge-ontrack";
        if (feature.status === "Delayed") statusBadgeClass = "status-badge-delayed";
        else if (feature.status === "Deployed") statusBadgeClass = "status-badge-deployed";

        // Type Badge Class
        let typeBadgeClass = "badge-platform";
        let barTypeClass = "gantt-bar-platform";
        if (feature.type === "UX") {
          typeBadgeClass = "badge-ux";
          barTypeClass = "gantt-bar-ux";
        } else if (feature.type === "Use Case") {
          typeBadgeClass = "badge-usecase";
          barTypeClass = "gantt-bar-usecase";
        }

        // Format Personas Badges
        const personasHtml = (feature.personas || []).map(p => `<span class="pill-persona">${p}</span>`).join(" ");

        // Format Components Badges
        const compNames = (feature.components || []).map(c => c.name);
        const compsHtml = compNames.map(c => `<span class="pill-component">${c}</span>`).join(" ");

        // Date Display
        const dateRangeStr = (rollup.startDate && rollup.endDate)
          ? `${formatDateDisplay(rollup.startDate)} - ${formatDateDisplay(rollup.endDate)} (${rollup.durationWeeks}w)`
          : "Dates pending";

        const gaDateStr = rollup.gaDate ? formatDateDisplay(rollup.gaDate) : "--";

        /* ==========================================================
           LEFT PANE ROW (Strict adherence to requirement #10):
           Line 1: Feature Type, Feature Description (Left Adjusted), GA Date (Right Adjusted) (Entire description on one line)
           Line 2: Personas, Impacted components (Left Adjusted), Start Date - End Date (Right Adjusted)
           ========================================================== */
        leftHtml += `
          <div class="feature-row" id="left-row-${feature.id}" onclick="toggleExpandRow('${feature.id}', event)">
            <!-- Floating Quick Actions -->
            <div class="row-actions-floating" onclick="event.stopPropagation()">
              <button class="btn btn-secondary btn-sm" title="Edit Feature" onclick="openEditModal('${feature.id}')">Edit</button>
              <button class="btn btn-secondary btn-sm" title="Clone Feature" onclick="cloneFeature('${feature.id}')">Clone</button>
              <button class="btn btn-secondary btn-sm" title="Delete Feature" style="color: #f87171;" onclick="deleteFeature('${feature.id}')">Delete</button>
            </div>

            <!-- Line 1: Type, Status, Description (Left) | GA Date (Right) -->
            <div class="row-line-1">
              <div class="row-line-1-left">
                <span class="badge ${typeBadgeClass}">${feature.type}</span>
                <span class="badge ${statusBadgeClass}">${feature.status}</span>
                <span class="feature-desc-text" title="${escapeHtml(feature.description)}">${escapeHtml(feature.description)}</span>
              </div>
              <div class="row-line-1-right">
                <span class="ga-date-badge" title="GA Milestone: Latest End Date + 1 Day">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 12l10 10 10-10L12 2z"/></svg>
                  GA: ${gaDateStr}
                </span>
              </div>
            </div>

            <!-- Line 2: Personas, Components (Left) | Start - End (Right) -->
            <div class="row-line-2">
              <div class="row-line-2-left">
                <span style="display:inline-flex; gap:3px;">${personasHtml}</span>
                <span style="color:var(--text-dim); font-size:10px;">|</span>
                <span style="display:inline-flex; gap:3px; overflow:hidden;">${compsHtml}</span>
              </div>
              <div class="row-line-2-right">
                ${dateRangeStr}
              </div>
            </div>
          </div>
        `;

        // If expanded, render sub-items in left pane
        if (isExpanded) {
          leftHtml += `
            <div class="feature-subitems-container" id="left-sub-${feature.id}">
              <div style="font-weight: 700; color: #a5b4fc; font-size: 11px; text-transform: uppercase;">Component Deliverables:</div>
          `;
          (feature.components || []).forEach(comp => {
            leftHtml += `
              <div class="subitem-row-left">
                <span style="font-weight:600; color:#cbd5e1;">▪ ${comp.name}</span>
                <span>${comp.startDate ? formatDateDisplay(parseDate(comp.startDate)) : "--"} - ${comp.endDate ? formatDateDisplay(parseDate(comp.endDate)) : "--"}</span>
              </div>
            `;

            if (comp.subitems && comp.subitems.length > 0) {
              comp.subitems.forEach(sub => {
                leftHtml += `
                  <div class="subitem-row-left" style="padding-left: 14px; font-size: 11px; color: var(--text-dim);">
                    <span>↳ ${escapeHtml(sub.name)}</span>
                    <span>${sub.startDate ? formatDateDisplay(parseDate(sub.startDate)) : "--"} - ${sub.endDate ? formatDateDisplay(parseDate(sub.endDate)) : "--"}</span>
                  </div>
                `;
              });
            }
          });
          leftHtml += `</div>`;
        }

        /* ==========================================================
           RIGHT PANE TIMELINE ROW (Gantt Master Bar + GA Diamond + Sub-bars)
           ========================================================== */
        let barX = 0;
        let barW = 0;
        let hasDates = rollup.startDate && rollup.endDate;

        if (hasDates) {
          barX = dateToPx(rollup.startDate);
          barW = Math.max(8, (diffDays(rollup.startDate, rollup.endDate) + 1) * pxPerDay);
        }

        let gaDiamondX = 0;
        if (rollup.gaDate) {
          gaDiamondX = dateToPx(rollup.gaDate);
        }

        const tooltipData = {
          desc: feature.description,
          type: feature.type,
          status: feature.status,
          personas: (feature.personas || []).join(", "),
          components: compNames.join(", "),
          start: rollup.startDate ? formatDateDisplay(rollup.startDate) : "--",
          end: rollup.endDate ? formatDateDisplay(rollup.endDate) : "--",
          ga: gaDateStr,
          duration: `${rollup.durationDays} days (${rollup.durationWeeks} weeks)`
        };

        rightHtml += `
          <div class="timeline-row" id="right-row-${feature.id}">
            <div class="gantt-bar-wrapper">
              ${hasDates ? `
                <div class="gantt-bar ${barTypeClass}"
                     style="left: ${barX}px; width: ${barW}px;"
                     onmousemove="showTooltip(event, ${escapeJsonAttr(tooltipData)})"
                     onmouseleave="hideTooltip()"
                     onclick="openEditModal('${feature.id}')">
                  <span class="gantt-bar-title">${escapeHtml(feature.description)}</span>
                </div>
              ` : `
                <div style="padding-left: 20px; font-size: 11px; color: var(--text-dim); font-style: italic;">
                  (Component dates not set)
                </div>
              `}

              ${rollup.gaDate ? `
                <div class="ga-milestone-indicator"
                     style="left: ${gaDiamondX}px;"
                     onmousemove="showTooltip(event, ${escapeJsonAttr({
                       title: "GA Milestone",
                       desc: feature.description,
                       ga: gaDateStr,
                       rule: "End Date + 1 Day",
                       status: feature.status
                     })})"
                     onmouseleave="hideTooltip()">
                  <div class="diamond-icon"></div>
                  <div class="ga-label-tooltip">GA ${gaDateStr}</div>
                </div>
              ` : ''}
            </div>
          </div>
        `;

        // If expanded, render component sub-bars on timeline matching left sub-items height
        if (isExpanded) {
          rightHtml += `<div class="timeline-subitems-wrapper" id="right-sub-${feature.id}">`;
          // Header spacer
          rightHtml += `<div style="height: 14px;"></div>`;

          (feature.components || []).forEach(comp => {
            const compStart = parseDate(comp.startDate);
            const compEnd = parseDate(comp.endDate);
            let compX = 0, compW = 0;
            if (compStart && compEnd) {
              compX = dateToPx(compStart);
              compW = Math.max(6, (diffDays(compStart, compEnd) + 1) * pxPerDay);
            }

            rightHtml += `
              <div class="subitem-bar-row">
                ${compStart && compEnd ? `
                  <div class="subitem-bar" style="left: ${compX}px; width: ${compW}px; background: rgba(59, 130, 246, 0.4); border-color: #60a5fa;"
                       onmousemove="showTooltip(event, ${escapeJsonAttr({
                         title: `Component: ${comp.name}`,
                         start: formatDateDisplay(compStart),
                         end: formatDateDisplay(compEnd),
                         duration: `${diffDays(compStart, compEnd)+1} days`
                       })})"
                       onmouseleave="hideTooltip()">
                    ${comp.name}
                  </div>
                ` : ''}
              </div>
            `;

            if (comp.subitems && comp.subitems.length > 0) {
              comp.subitems.forEach(sub => {
                const subStart = parseDate(sub.startDate);
                const subEnd = parseDate(sub.endDate);
                let sX = 0, sW = 0;
                if (subStart && subEnd) {
                  sX = dateToPx(subStart);
                  sW = Math.max(4, (diffDays(subStart, subEnd) + 1) * pxPerDay);
                }
                rightHtml += `
                  <div class="subitem-bar-row">
                    ${subStart && subEnd ? `
                      <div class="subitem-bar" style="left: ${sX}px; width: ${sW}px; background: rgba(148, 163, 184, 0.3); border-color: #94a3b8;"
                           onmousemove="showTooltip(event, ${escapeJsonAttr({
                             title: `Sub-item: ${sub.name}`,
                             component: comp.name,
                             start: formatDateDisplay(subStart),
                             end: formatDateDisplay(subEnd),
                             duration: `${diffDays(subStart, subEnd)+1} days`
                           })})"
                           onmouseleave="hideTooltip()">
                        ↳ ${escapeHtml(sub.name)}
                      </div>
                    ` : ''}
                  </div>
                `;
              });
            }
          });
          rightHtml += `</div>`;
        }
      });

      leftContainer.innerHTML = leftHtml;
      rightContainer.innerHTML = rightHtml;

      // Sync Heights across matching left and right rows exactly
      setTimeout(syncRowHeights, 0);
    }

    function syncRowHeights() {
      const filtered = getFilteredFeatures();
      filtered.forEach(feature => {
        const leftEl = document.getElementById(`left-row-${feature.id}`);
        const rightEl = document.getElementById(`right-row-${feature.id}`);
        if (leftEl && rightEl) {
          const maxH = Math.max(leftEl.offsetHeight, rightEl.offsetHeight, 82);
          leftEl.style.height = `${maxH}px`;
          rightEl.style.height = `${maxH}px`;
        }

        const leftSub = document.getElementById(`left-sub-${feature.id}`);
        const rightSub = document.getElementById(`right-sub-${feature.id}`);
        if (leftSub && rightSub) {
          const subH = Math.max(leftSub.offsetHeight, rightSub.offsetHeight);
          leftSub.style.height = `${subH}px`;
          rightSub.style.height = `${subH}px`;
        }
      });
    }

    function toggleExpandRow(id, evt) {
      if (evt && (evt.target.closest("button") || evt.target.closest(".row-actions-floating"))) return;
      if (expandedFeatureIds.has(id)) {
        expandedFeatureIds.delete(id);
      } else {
        expandedFeatureIds.add(id);
      }
      renderRows();
    }

    /* =====================================================================
       Tooltip Logic
       ==================================================================== */
    const tooltipEl = document.getElementById("global-tooltip");

    function showTooltip(evt, data) {
      let content = "";
      if (data.title) {
        content += `<h4>${escapeHtml(data.title)}</h4>`;
      }
      if (data.desc) {
        content += `<div style="font-weight:600; margin-bottom:6px; color:#f8fafc;">${escapeHtml(data.desc)}</div>`;
      }
      if (data.type) {
        content += `<div class="tooltip-line"><span class="tooltip-label">Type:</span><span>${data.type}</span></div>`;
      }
      if (data.status) {
        content += `<div class="tooltip-line"><span class="tooltip-label">Status:</span><span>${data.status}</span></div>`;
      }
      if (data.personas) {
        content += `<div class="tooltip-line"><span class="tooltip-label">Personas:</span><span>${data.personas}</span></div>`;
      }
      if (data.components) {
        content += `<div class="tooltip-line"><span class="tooltip-label">Components:</span><span>${data.components}</span></div>`;
      }
      if (data.start && data.end) {
        content += `<div class="tooltip-line"><span class="tooltip-label">Span:</span><span>${data.start} → ${data.end}</span></div>`;
      }
      if (data.duration) {
        content += `<div class="tooltip-line"><span class="tooltip-label">Duration:</span><span>${data.duration}</span></div>`;
      }
      if (data.ga) {
        content += `<div class="tooltip-line" style="color:#d8b4fe; font-weight:700;"><span class="tooltip-label" style="color:#c084fc;">GA Milestone:</span><span>${data.ga}</span></div>`;
      }

      tooltipEl.innerHTML = content;
      tooltipEl.style.display = "block";

      const x = Math.min(window.innerWidth - 340, evt.clientX + 15);
      const y = Math.min(window.innerHeight - 200, evt.clientY + 15);
      tooltipEl.style.left = `${x}px`;
      tooltipEl.style.top = `${y}px`;
    }

    function hideTooltip() {
      tooltipEl.style.display = "none";
    }

    /* =====================================================================
       Feature Line Modal (Add & Edit)
       ===================================================================== */
    let modalSelectedPersonas = new Set();
    let modalSelectedComponentsMap = new Map();

    function openAddModal() {
      editingFeatureId = null;
      document.getElementById("modal-title").innerText = "Add New Feature Line";
      document.getElementById("form-feature-desc").value = "";
      document.getElementById("form-feature-status").value = "On Track";

      // Default Type: Platform
      const radio = document.querySelector('input[name="form-feature-type"][value="Platform"]');
      if (radio) radio.checked = true;
      updateTypeRadioVisuals();

      // Default personas: SP
      modalSelectedPersonas = new Set(["SP"]);

      // Default component: Data Product
      modalSelectedComponentsMap = new Map();
      modalSelectedComponentsMap.set("Data Product", {
        startDate: "2026-11-18",
        endDate: "2026-12-16",
        subitems: []
      });

      renderModalPersonaChips();
      renderModalComponentChecklist();
      renderModalComponentsEditor();
      updateModalRollupDisplay();

      document.getElementById("feature-modal").classList.add("open");
    }

    function openEditModal(featureId) {
      editingFeatureId = featureId;
      const feat = featuresData.find(f => f.id === featureId);
      if (!feat) return;

      document.getElementById("modal-title").innerText = "Edit Feature Line";
      document.getElementById("form-feature-desc").value = feat.description;
      document.getElementById("form-feature-status").value = feat.status;

      const radio = document.querySelector(`input[name="form-feature-type"][value="${feat.type}"]`);
      if (radio) radio.checked = true;
      updateTypeRadioVisuals();

      modalSelectedPersonas = new Set(feat.personas || []);

      modalSelectedComponentsMap = new Map();
      (feat.components || []).forEach(c => {
        modalSelectedComponentsMap.set(c.name, {
          startDate: c.startDate || "",
          endDate: c.endDate || "",
          subitems: JSON.parse(JSON.stringify(c.subitems || []))
        });
      });

      renderModalPersonaChips();
      renderModalComponentChecklist();
      renderModalComponentsEditor();
      updateModalRollupDisplay();

      document.getElementById("feature-modal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("feature-modal").classList.remove("open");
      editingFeatureId = null;
    }

    function updateTypeRadioVisuals() {
      const selected = document.querySelector('input[name="form-feature-type"]:checked').value;
      const lblPlatform = document.getElementById("lbl-type-platform");
      const lblUx = document.getElementById("lbl-type-ux");
      const lblUseCase = document.getElementById("lbl-type-usecase");

      lblPlatform.className = "type-choice-label";
      lblUx.className = "type-choice-label";
      lblUseCase.className = "type-choice-label";

      if (selected === "Platform") lblPlatform.classList.add("selected-platform");
      else if (selected === "UX") lblUx.classList.add("selected-ux");
      else if (selected === "Use Case") lblUseCase.classList.add("selected-usecase");
    }

    /* Modal Personas */
    function renderModalPersonaChips() {
      const box = document.getElementById("personas-chips-box");
      let html = "";
      availablePersonas.forEach(p => {
        const isSel = modalSelectedPersonas.has(p);
        html += `
          <div class="tag-chip ${isSel ? 'active' : ''}" onclick="toggleModalPersona('${p}')" style="cursor:pointer;">
            <span>${p}</span>
            ${isSel ? `<span class="remove-tag" onclick="event.stopPropagation(); toggleModalPersona('${p}')">✕</span>` : `<span>+</span>`}
          </div>
        `;
      });
      box.innerHTML = html;
    }

    function toggleModalPersona(persona) {
      if (modalSelectedPersonas.has(persona)) {
        modalSelectedPersonas.delete(persona);
      } else {
        modalSelectedPersonas.add(persona);
      }
      renderModalPersonaChips();
    }

    function addNewPersonaChip() {
      const input = document.getElementById("new-persona-input");
      const val = input.value.trim().toUpperCase();
      if (!val) return;
      if (!availablePersonas.includes(val)) {
        commitOp({ type: "addPersona", value: val });
      }
      modalSelectedPersonas.add(val);
      input.value = "";
      renderModalPersonaChips();
      renderPersonaFilterOptions();
    }

    /* Modal Components */
    function renderModalComponentChecklist() {
      const box = document.getElementById("components-picker-box");
      let html = "";
      availableComponents.forEach(comp => {
        const isSel = modalSelectedComponentsMap.has(comp);
        html += `
          <div class="tag-chip ${isSel ? 'active' : ''}" onclick="toggleModalComponent('${comp}')" style="cursor:pointer;">
            <span>${comp}</span>
            ${isSel ? `<span class="remove-tag" onclick="event.stopPropagation(); toggleModalComponent('${comp}')">✕</span>` : `<span>+</span>`}
          </div>
        `;
      });
      box.innerHTML = html;
    }

    function toggleModalComponent(compName) {
      if (modalSelectedComponentsMap.has(compName)) {
        modalSelectedComponentsMap.delete(compName);
      } else {
        modalSelectedComponentsMap.set(compName, {
          startDate: "2026-11-18",
          endDate: "2026-12-16",
          subitems: []
        });
      }
      renderModalComponentChecklist();
      renderModalComponentsEditor();
      updateModalRollupDisplay();
    }

    function addNewCustomComponent() {
      const input = document.getElementById("new-component-input");
      const val = input.value.trim();
      if (!val) return;
      if (!availableComponents.includes(val)) {
        commitOp({ type: "addComponent", value: val });
      }
      modalSelectedComponentsMap.set(val, {
        startDate: "2026-11-18",
        endDate: "2026-12-16",
        subitems: []
      });
      input.value = "";
      renderModalComponentChecklist();
      renderModalComponentsEditor();
      updateModalRollupDisplay();
    }

    /* Modal Components Dates & Sub-Items Editor */
    function renderModalComponentsEditor() {
      const container = document.getElementById("components-editor-list");
      if (modalSelectedComponentsMap.size === 0) {
        container.innerHTML = `<div style="font-size:12px; color:var(--text-dim); text-align:center; padding:10px;">Select at least one component above to configure delivery dates and sub-items.</div>`;
        return;
      }

      let html = "";
      modalSelectedComponentsMap.forEach((compData, compName) => {
        html += `
          <div class="component-card-edit">
            <div class="component-card-top">
              <span class="component-name-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                ${compName}
              </span>

              <div class="dates-inputs-inline">
                <span>Start:</span>
                <input type="date" class="date-picker-sm" value="${compData.startDate || ''}" onchange="updateCompDate('${compName}', 'startDate', this.value)">
                <span>End:</span>
                <input type="date" class="date-picker-sm" value="${compData.endDate || ''}" onchange="updateCompDate('${compName}', 'endDate', this.value)">
                <button class="btn btn-secondary btn-sm" style="color:#f87171;" onclick="toggleModalComponent('${compName}')">Remove</button>
              </div>
            </div>

            <!-- Sub-items List -->
            <div class="subitems-editor-box">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase;">Sub-items / Micro-tasks:</span>
                <button type="button" class="btn btn-secondary btn-sm" onclick="addSubItem('${compName}')">+ Add Sub-item</button>
              </div>
        `;

        (compData.subitems || []).forEach((sub, subIdx) => {
          html += `
            <div class="subitem-edit-row">
              <input type="text" placeholder="Sub-item deliverable description..." value="${escapeHtml(sub.name)}" oninput="updateSubItemField('${compName}', ${subIdx}, 'name', this.value)">
              <input type="date" class="date-picker-sm" value="${sub.startDate || ''}" onchange="updateSubItemField('${compName}', ${subIdx}, 'startDate', this.value)">
              <input type="date" class="date-picker-sm" value="${sub.endDate || ''}" onchange="updateSubItemField('${compName}', ${subIdx}, 'endDate', this.value)">
              <button class="btn-icon" style="color:#f87171; padding:3px 6px;" onclick="removeSubItem('${compName}', ${subIdx})">✕</button>
            </div>
          `;
        });

        html += `
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function updateCompDate(compName, field, value) {
      if (modalSelectedComponentsMap.has(compName)) {
        modalSelectedComponentsMap.get(compName)[field] = value;
        updateModalRollupDisplay();
      }
    }

    function addSubItem(compName) {
      if (modalSelectedComponentsMap.has(compName)) {
        const comp = modalSelectedComponentsMap.get(compName);
        comp.subitems.push({
          name: "New Work Package",
          startDate: comp.startDate || "2026-11-18",
          endDate: comp.endDate || "2026-12-02"
        });
        renderModalComponentsEditor();
        updateModalRollupDisplay();
      }
    }

    function updateSubItemField(compName, subIdx, field, value) {
      if (modalSelectedComponentsMap.has(compName)) {
        const comp = modalSelectedComponentsMap.get(compName);
        if (comp.subitems[subIdx]) {
          comp.subitems[subIdx][field] = value;
          updateModalRollupDisplay();
        }
      }
    }

    function removeSubItem(compName, subIdx) {
      if (modalSelectedComponentsMap.has(compName)) {
        const comp = modalSelectedComponentsMap.get(compName);
        comp.subitems.splice(subIdx, 1);
        renderModalComponentsEditor();
        updateModalRollupDisplay();
      }
    }

    /* Live Non-Editable Rollup Calculation inside Modal */
    function updateModalRollupDisplay() {
      const tempComponents = [];
      modalSelectedComponentsMap.forEach((cData, cName) => {
        tempComponents.push({
          name: cName,
          startDate: cData.startDate,
          endDate: cData.endDate,
          subitems: cData.subitems
        });
      });

      const tempFeature = { components: tempComponents };
      const rollup = calculateFeatureRollup(tempFeature);

      document.getElementById("rollup-start-display").innerText = rollup.startDate ? formatDateDisplay(rollup.startDate) : "--";
      document.getElementById("rollup-end-display").innerText = rollup.endDate ? formatDateDisplay(rollup.endDate) : "--";
      document.getElementById("rollup-duration-display").innerText = (rollup.durationDays > 0) ? `${rollup.durationDays} days (${rollup.durationWeeks}w)` : "--";
      document.getElementById("rollup-ga-display").innerText = rollup.gaDate ? formatDateDisplay(rollup.gaDate) : "--";
    }

    /* Save Feature from Modal */
    function saveFeatureFromModal() {
      const desc = document.getElementById("form-feature-desc").value.trim();
      if (!desc) {
        alert("Please enter a feature description.");
        return;
      }

      const status = document.getElementById("form-feature-status").value;
      const type = document.querySelector('input[name="form-feature-type"]:checked').value;
      const personas = Array.from(modalSelectedPersonas);

      const components = [];
      modalSelectedComponentsMap.forEach((cData, cName) => {
        components.push({
          name: cName,
          startDate: cData.startDate,
          endDate: cData.endDate,
          subitems: cData.subitems
        });
      });

      if (components.length === 0) {
        alert("Please select at least one component.");
        return;
      }

      if (editingFeatureId) {
        const idx = featuresData.findIndex(f => f.id === editingFeatureId);
        if (idx !== -1) {
          commitOp({
            type: "upsertFeature",
            feature: {
              id: editingFeatureId,
              description: desc,
              status: status,
              type: type,
              personas: personas,
              components: components
            }
          });
        }
      } else {
        const newId = "feat-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6);
        commitOp({
          type: "upsertFeature",
          feature: {
            id: newId,
            description: desc,
            status: status,
            type: type,
            personas: personas,
            components: components
          }
        });
      }

      closeModal();
      renderApp();
    }

    function cloneFeature(id) {
      const source = featuresData.find(f => f.id === id);
      if (!source) return;
      const copy = JSON.parse(JSON.stringify(source));
      copy.id = "feat-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6);
      copy.description = copy.description + " (Copy)";
      commitOp({ type: "upsertFeature", feature: copy });
      renderApp();
    }

    function deleteFeature(id) {
      if (confirm("Are you sure you want to delete this feature line?")) {
        expandedFeatureIds.delete(id);
        commitOp({ type: "deleteFeature", id: id });
        renderApp();
      }
    }

    /* Helpers */
    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeJsonAttr(obj) {
      const json = JSON.stringify(obj);
      return json.replace(/"/g, "&quot;");
    }

    /* Initialize Application on DOM Ready */
    window.addEventListener("DOMContentLoaded", async () => {
      initTheme();
      await initSharedData();
      renderApp();
      // Centering on Today (11/18/2026) initially
      setTimeout(jumpToToday, 100);
    });
  </script>
</body>
</html>
